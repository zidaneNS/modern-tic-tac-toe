<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Modern TicTacToe | VS AI</title>
    <link rel="shotcut icon" type="img" href="assets/logo.png" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>

      <div id="scoreboard">
        <div class="score" id="combinedScore">P1: 0 | P2: 0</div>
      </div>

      <header id="header">
        <div class="player player-active" id="displayPlayer1">P1</div>

        <div class="tittleHeader">
          <h3 id="title"></h3>
        </div>
        
        <div class="player player-active" id="displayPlayer2">P2</div>
      </header>

      <!--board-->
      <div id="board">
        <div id="cell-0-0" class="cell"></div>
        <div id="cell-0-1" class="cell"></div>
        <div id="cell-0-2" class="cell"></div>
        <div id="cell-1-0" class="cell"></div>
        <div id="cell-1-1" class="cell"></div>
        <div id="cell-1-2" class="cell"></div>
        <div id="cell-2-0" class="cell"></div>
        <div id="cell-2-1" class="cell"></div>
        <div id="cell-2-2" class="cell"></div>
      </div>

      <!--to choose your pawn-->
      <div>
        <div id="pawn">
          <div class="pawnCell" id="king">
            <img src="assets/king putih.png" alt="raja">
          </div>

          <div class="pawnCell" id="knight">
            <img src="assets/knight putih.png" alt="ksatria">
          </div>

          <div class="pawnCell" id="pion">
            <img src="assets/pion putih.png" alt="pion">
          </div>
        </div>
      </div>
      <button id="restartButton">Restart</button>
    </main>
    <script type="module" src="script.js"></script>
  </body>
</html>
